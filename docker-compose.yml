services:
  db:
    image: postgres:16-alpine
    container_name: doorkey-db
    environment:
      POSTGRES_USER: doorkey
      POSTGRES_PASSWORD: doorkey
      POSTGRES_DB: doorkey
    ports: ['5432:5432']
    volumes: ['doorkey-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doorkey']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  doorkey-pg:
